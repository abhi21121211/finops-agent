name: Deploy backend

# Pushes the backend to the Hugging Face Space after CI passes on main.
# The frontend deploys itself through Vercel's GitHub integration.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

jobs:
  hf-space:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_SPACE: ${{ vars.HF_SPACE }}  # e.g. your-username/finops-agent-api
    steps:
      - uses: actions/checkout@v4
      - name: Check configuration
        id: cfg
        run: |
          if [ -z "$HF_TOKEN" ] || [ -z "$HF_SPACE" ]; then
            echo "::warning::Backend deploy skipped: set the HF_TOKEN secret and HF_SPACE variable (docs/deploy.md)."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Assemble Space repository
        if: steps.cfg.outputs.ok == 'true'
        run: |
          mkdir space
          cp -r backend space/backend
          rm -rf space/backend/tests space/backend/.venv
          mkdir -p space/infra/litellm && cp infra/litellm/config.yaml space/infra/litellm/
          cp deploy/hf-space/Dockerfile deploy/hf-space/start.sh deploy/hf-space/README.md space/
      - name: Push to the Space
        if: steps.cfg.outputs.ok == 'true'
        working-directory: space
        run: |
          git init -q -b main
          git config user.email "actions@github.com"
          git config user.name "github-actions"
          git add -A
          git commit -qm "Deploy ${GITHUB_SHA::7}"
          git push --force "https://user:${HF_TOKEN}@huggingface.co/spaces/${HF_SPACE}" main
