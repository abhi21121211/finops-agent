name: Eval

# PRs run the 20-case smoke set and fail on a >2-point field-accuracy drop or any false
# auto-approval. Merges to main and the nightly schedule run all 100 cases.
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "30 20 * * *"  # 02:00 IST
  workflow_dispatch:
    inputs:
      mode:
        description: smoke or full
        default: smoke

concurrency:
  group: eval-${{ github.ref }}
  cancel-in-progress: true

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: finops
          POSTGRES_PASSWORD: finops
          POSTGRES_DB: finops
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U finops" --health-interval 3s --health-retries 20
    env:
      DATABASE_URL: postgresql+asyncpg://finops:finops@localhost:5432/finops
      LLM_ROUTER_URL: http://localhost:4000/v1
      LLM_ROUTER_KEY: ci-${{ github.run_id }}
      LITELLM_MASTER_KEY: ci-${{ github.run_id }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Check provider secrets
        id: keys
        run: |
          if [ -z "$GEMINI_API_KEY$MISTRAL_API_KEY$OPENROUTER_API_KEY" ]; then
            echo "::warning::No LLM provider secrets configured (forks get none); skipping eval."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: astral-sh/setup-uv@v5
        if: steps.keys.outputs.ok == 'true'

      - name: Start the LLM router (LiteLLM, free providers)
        if: steps.keys.outputs.ok == 'true'
        run: |
          uv tool install 'litellm[proxy]'
          # LiteLLM would treat the job's DATABASE_URL as its own database and exit.
          env -u DATABASE_URL litellm --config infra/litellm/config.yaml --port 4000 > litellm.log 2>&1 &
          for i in $(seq 1 60); do curl -sf localhost:4000/health/liveliness && break; sleep 2; done

      - name: Prepare backend and dataset
        if: steps.keys.outputs.ok == 'true'
        working-directory: backend
        run: |
          uv sync --frozen
          uv run alembic upgrade head
          uv run python ../scripts/generate_dataset.py

      - name: Run eval
        if: steps.keys.outputs.ok == 'true'
        working-directory: backend
        run: |
          MODE=smoke
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ github.event_name }}" = "push" ]; then MODE=full; fi
          if [ "${{ github.event.inputs.mode }}" = "full" ]; then MODE=full; fi
          ARGS="--label ${{ github.event_name }}"
          [ "$MODE" = "smoke" ] && ARGS="$ARGS --smoke"
          uv run python ../evals/run.py $ARGS --concurrency 3

      - uses: actions/upload-artifact@v4
        if: always() && steps.keys.outputs.ok == 'true'
        with:
          name: eval-report
          path: |
            evals/reports/
            litellm.log
