name: Eval

# PRs run the 20-case smoke set and fail on a >2-point field-accuracy drop or any false
# auto-approval. A weekly schedule runs all 100 cases. Not on pushes to main: Render
# deploys only when every check on the commit passes, so an LLM quota hiccup in an eval
# would block deploys (it did once). Deploys depend on CI; evals gate pull requests.
on:
  pull_request:
  schedule:
    - cron: "30 20 * * 0"  # weekly, Monday 02:00 IST (saves free LLM quota)
  workflow_dispatch:
    inputs:
      mode:
        description: smoke or full
        default: smoke

concurrency:
  group: eval-${{ github.ref }}
  cancel-in-progress: true

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: finops
          POSTGRES_PASSWORD: finops
          POSTGRES_DB: finops
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U finops" --health-interval 3s --health-retries 20
    env:
      DATABASE_URL: postgresql+asyncpg://finops:finops@localhost:5432/finops
      # Same as production: the app calls providers directly, skips any without a key
      # and fails over on errors. (Through LiteLLM, a provider whose secret is unset
      # answered 401 and LiteLLM doesn't fail over on 401: 12 cases errored.)
      LLM_MODE: direct
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Check provider secrets
        id: keys
        run: |
          if [ -z "$GEMINI_API_KEY$MISTRAL_API_KEY$OPENROUTER_API_KEY" ]; then
            echo "::warning::No LLM provider secrets configured (forks get none); skipping eval."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: astral-sh/setup-uv@v5
        if: steps.keys.outputs.ok == 'true'

      - name: Prepare backend and dataset
        if: steps.keys.outputs.ok == 'true'
        working-directory: backend
        run: |
          uv sync --frozen
          uv run alembic upgrade head
          uv run python ../scripts/generate_dataset.py

      - name: Run eval
        if: steps.keys.outputs.ok == 'true'
        working-directory: backend
        run: |
          MODE=smoke
          if [ "${{ github.event_name }}" = "schedule" ]; then MODE=full; fi
          if [ "${{ github.event.inputs.mode }}" = "full" ]; then MODE=full; fi
          ARGS="--label ${{ github.event_name }}"
          [ "$MODE" = "smoke" ] && ARGS="$ARGS --smoke"
          uv run python ../evals/run.py $ARGS --concurrency 3

      - uses: actions/upload-artifact@v4
        if: always() && steps.keys.outputs.ok == 'true'
        with:
          name: eval-report
          path: evals/reports/
