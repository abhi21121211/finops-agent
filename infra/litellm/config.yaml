# LiteLLM proxy config for FinOps Agent in CI and production.
#
# Mirrors the developer's local router: three tiers, each a pool of FREE deployments
# that LiteLLM load-balances and fails over between. API keys come only from environment
# variables (GitHub Actions secrets in CI); none are stored here. Production calls
# providers directly instead (LLM_MODE=direct, backend/app/llm/direct.py).
# A deployment whose key is missing just fails and is cooled down.
#
#   vision   – multimodal, invoice extraction
#   powerful – hard text reasoning
#   normal   – cheap judgements (PO line matching)
#

model_list:
  # ───────────────────────── POWERFUL tier ─────────────────────────
  # Use for: Nivesh AI / Money Manegment transaction parsing & reasoning,
  # Project PA script generation, TradeSense LLM reasoning, RoomLoop's "Ted".
  - model_name: powerful
    litellm_params:
      model: openrouter/qwen/qwen3.8-27b:free
      api_key: os.environ/OPENROUTER_API_KEY
    model_info:
      router_tier: powerful
      provider_label: OpenRouter (Qwen 3.8 27B free)
  # DeepSeek v4 flash free was retired by OpenRouter (~2026-09): it now 404s
  # ("unavailable for free"), and LiteLLM doesn't fall back on 404, so it
  # broke the whole powerful tier. Replaced with Qwen above.

  - model_name: powerful
    litellm_params:
      model: openrouter/nvidia/nemotron-3-ultra-550b-a55b:free
      api_key: os.environ/OPENROUTER_API_KEY
    model_info:
      router_tier: powerful
      provider_label: OpenRouter (Nemotron 3 Ultra free)

  - model_name: powerful
    litellm_params:
      model: gemini/gemini-flash-latest
      api_key: os.environ/GEMINI_API_KEY
    model_info:
      router_tier: powerful
      provider_label: Google AI Studio (Gemini Flash, latest alias)

  - model_name: powerful
    litellm_params:
      model: mistral/mistral-medium-latest
      api_key: os.environ/MISTRAL_API_KEY
    model_info:
      router_tier: powerful
      provider_label: Mistral (free tier)

  - model_name: powerful
    litellm_params:
      model: openrouter/google/gemma-4-31b-it:free
      api_key: os.environ/OPENROUTER_API_KEY
    model_info:
      router_tier: powerful
      provider_label: OpenRouter (Gemma 4 31B free)

  - model_name: powerful
    litellm_params:
      model: openrouter/nvidia/nemotron-3-super-120b-a12b:free
      api_key: os.environ/OPENROUTER_API_KEY
    model_info:
      router_tier: powerful
      provider_label: OpenRouter (Nemotron 3 Super free)

  # ───────────────────────── NORMAL tier ─────────────────────────
  # Use for: simple classification, short replies, formatting, cheap parsing.
  - model_name: normal
    litellm_params:
      model: groq/openai/gpt-oss-20b
      api_key: os.environ/GROQ_API_KEY
    model_info:
      router_tier: normal
      provider_label: Groq (fast, free)

  - model_name: normal
    litellm_params:
      model: gemini/gemini-flash-lite-latest
      api_key: os.environ/GEMINI_API_KEY
    model_info:
      router_tier: normal
      provider_label: Google AI Studio (Flash-Lite, latest alias)

  # Cerebras is disabled for now: this account's key returns HTTP 402
  # ("Payment required to access this resource") on every model, meaning
  # its free tier isn't active (needs a payment method on file at
  # https://cloud.cerebras.ai/ billing). LiteLLM's router treats 402 as a
  # non-retryable client error and raises immediately instead of falling
  # back to the next deployment in this pool, so a broken 402 entry here
  # would fail ~1-in-N "normal" requests outright. Re-enable once fixed:
  # - model_name: normal
  #   litellm_params:
  #     model: cerebras/qwen-3.8-27b
  #     api_key: os.environ/CEREBRAS_API_KEY
  #   model_info:
  #     router_tier: normal
  #     provider_label: Cerebras (free tier)

  - model_name: normal
    litellm_params:
      model: openrouter/liquid/lfm-2.5-2.6b:free
      api_key: os.environ/OPENROUTER_API_KEY
    model_info:
      router_tier: normal
      provider_label: OpenRouter (LFM 2.5 2.6B free)

  # ───────────────────────── VISION tier ─────────────────────────
  # Use for: requests that include images (FinOps invoice extraction).
  # Only multimodal models here — "powerful" mixes in text-only models
  # (Qwen, Nemotron) that would choke on an image payload.
  - model_name: vision
    litellm_params:
      model: gemini/gemini-flash-latest
      api_key: os.environ/GEMINI_API_KEY
    model_info:
      router_tier: vision
      provider_label: Google AI Studio (Gemini Flash, latest alias)

  - model_name: vision
    litellm_params:
      model: mistral/mistral-medium-latest
      api_key: os.environ/MISTRAL_API_KEY
    model_info:
      router_tier: vision
      provider_label: Mistral Medium (free tier, multimodal)

  - model_name: vision
    litellm_params:
      model: openrouter/google/gemma-4-31b-it:free
      api_key: os.environ/OPENROUTER_API_KEY
    model_info:
      router_tier: vision
      provider_label: OpenRouter (Gemma 4 31B free, multimodal)

  # Separate Gemini quota from Flash; weaker but keeps vision alive when the
  # others are rate-limited at the same moment.
  - model_name: vision
    litellm_params:
      model: gemini/gemini-flash-lite-latest
      api_key: os.environ/GEMINI_API_KEY
    model_info:
      router_tier: vision
      provider_label: Google AI Studio (Flash-Lite, multimodal)

# Router behavior: retry the next deployment in the same pool on failure,
# and temporarily skip (cool down) any deployment that just failed instead
# of hammering an exhausted free quota.
router_settings:
  routing_strategy: simple-shuffle
  num_retries: 3
  allowed_fails: 2
  cooldown_time: 60
  # If every "powerful" deployment is rate-limited/overloaded at once (common
  # at peak hours on free tiers), answer from the "normal" pool instead of
  # returning an error to the app.
  fallbacks:
    - powerful: ["normal"]

litellm_settings:
  drop_params: true
  set_verbose: false
  # Optional but recommended once this is running for real:
  # request_timeout: 30

general_settings:
  # Set LITELLM_MASTER_KEY in your .env to require this key from callers.
  # If you skip it, the proxy is open to anything that can reach the port —
  # fine on localhost, not fine if you ever expose this beyond your machine.
  master_key: os.environ/LITELLM_MASTER_KEY
